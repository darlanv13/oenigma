name: oenigma
description: Enigma City
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  parse_server_sdk_flutter: ^3.1.2
  font_awesome_flutter: ^11.0.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  sidebarx: ^0.17.1
  flutter_svg: ^2.0.10
  uuid: ^4.4.0
  audioplayers: ^6.0.0
  url_launcher: ^6.2.6
  carousel_slider: ^4.2.1
  barcode_widget: ^2.0.4
  mobile_scanner: ^5.0.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.3
  image_picker: ^1.1.2
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.1
  logger: ^2.3.0
  http: ^1.2.1
  vibration: ^1.8.4
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
